#:schema https://mise.jdx.dev/schema/mise.json
# Tools for working on this repo. Installed by `mise install` (runs in postCreate).
#
# Exact versions and checksums are pinned in mise.lock, so "latest"/"lts" here
# only say what `mise lock --bump` moves to. The Upgrade tools workflow does
# that daily and opens a PR, so new versions only arrive after Test passes.

# mise.lock is lockfile format 4, which older mise can't read. Raise this when
# a newer mise writes a newer format, so an old mise says to upgrade instead of
# failing to parse the lockfile.
min_version = "2026.11.1"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]
# Cooldown, like Dependabot's: only resolve "latest"/"lts" to releases at least
# 7 days old, so a compromised or broken release has time to be pulled.
minimum_release_age = "7d"
# Install only what mise.lock records, with a URL and checksum per platform;
# a missing or incomplete entry is an error instead of a fresh lookup. To add a
# tool, add it under [tools], then run `mise lock` and `mise install`
# (`mise use` refuses tools that aren't locked yet).
locked = true
# Plugin backends run community install scripts; this repo doesn't use them.
disable_backends = ["asdf", "vfox"]

[tools]
node = "lts"
"npm:@devcontainers/cli" = "latest"
shellcheck = "latest"
starship = "latest"
zizmor = "latest"

[tasks.test]
description = "Build the image locally and test the dev template"
run = """
devcontainer build --workspace-folder images/dev --image-name ghcr.io/andykenward/devcontainer-dev:local
.github/scripts/test-template.sh dev
"""

[tasks.lint]
description = "Shellcheck all scripts and audit GitHub Actions workflows with zizmor"
run = [
  "shellcheck images/dev/.devcontainer/*.sh test/*/test.sh .github/scripts/*.sh",
  "zizmor .",
]
