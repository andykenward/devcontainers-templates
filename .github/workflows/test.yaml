name: Test

# Lints the scripts and workflows, builds the image locally (amd64) and runs the
# template against it, including a rebuild to check that the volumes persist.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress: only the newest
# commit's checks count. Other runs (main, manual) each get their own group, so they are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools in mise.toml and runs the same lint task as locally.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8 # bumped by Renovate (renovate.json)

      # GH_TOKEN turns on zizmor's online audits (known-vulnerable actions etc.).
      - run: mise run lint
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Provides the devcontainer CLI from mise.toml.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8 # bumped by Renovate (renovate.json)

      - name: Build image locally
        run: |
          devcontainer build \
            --workspace-folder images/dev \
            --image-name "ghcr.io/${GITHUB_REPOSITORY_OWNER}/devcontainer-dev:local"

      # Ubuntu 24.04 hosts stop unprivileged processes from mapping user IDs in
      # a new user namespace, which VS Code's sandbox (unshare) needs even with
      # the template's sandbox options. See the template README's "Agent sandbox".
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test template
        run: .github/scripts/test-template.sh dev
