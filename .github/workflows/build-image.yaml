name: Build image

# Builds the prebuilt image (amd64 + arm64) and pushes it to GHCR as
# ghcr.io/<owner>/devcontainer-dev:latest and :<yyyy-mm-dd>.
# The weekly schedule picks up new releases of mise, Node LTS, gh and zizmor.
on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/build-image.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          subFolder: images/dev
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: latest,${{ steps.date.outputs.tag }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          platform: linux/amd64,linux/arm64
          push: always
