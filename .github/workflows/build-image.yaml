name: Build image

# Builds the prebuilt image (amd64 + arm64) and pushes it to GHCR as
# ghcr.io/<owner>/devcontainer-dev:latest and :<yyyy-mm-dd>.
# The weekly schedule picks up new releases of mise, Node LTS, Claude Code and gh.
on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/build-image.yaml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: devcontainers/ci@v0.3
        with:
          subFolder: images/dev
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: latest,${{ steps.date.outputs.tag }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          platform: linux/amd64,linux/arm64
          push: always
