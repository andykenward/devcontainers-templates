name: Build image

# Builds the prebuilt image (amd64 + arm64) from a released version and pushes
# it to GHCR as ghcr.io/<owner>/devcontainer-dev with the tags
#   <X.Y.Z>, <X.Y>, <X>, latest and <yyyy-mm-dd>.
#
# - On release: release.yaml calls this with the new image-v<X.Y.Z> tag.
# - Weekly: rebuilds the latest image release without the layer cache, picking
#   up new releases of the base image's packages, mise, Node LTS, gh and
#   zizmor. The version tags move to the fresh build, so projects on `1` or
#   `1.2` get security updates without a new release. Unreleased changes on
#   main are never published.
# - On demand: builds the given release. The floating tags <X.Y>, <X> and
#   latest only move to a build that is the newest release of that series, so
#   rebuilding 1.2.0 after 1.3.0 can't roll `1` or `latest` back.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the latest release.
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the latest release.
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-dev

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      image-tags: ${{ steps.find.outputs.image-tags }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/image-v" --jq '.[].ref | sub("^refs/tags/"; "")' \
            | grep -E '^image-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          if [ -z "$TAG" ]; then
            TAG="$(tail -1 <<<"$releases")"
          fi
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::No image release yet, nothing to rebuild"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^image-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::No image release to build (tag: '${TAG}')"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          # The release's own version and a dated tag always; a floating tag
          # only when this release is the newest one it could point at.
          newest() { grep -E "$1" <<<"$releases" | tail -1; }
          tags="${version},$(date -u +%Y-%m-%d)"
          [ "$(newest "^image-v${version%.*}\.")" = "$TAG" ] && tags+=",${version%.*}"
          [ "$(newest "^image-v${version%%.*}\.")" = "$TAG" ] && tags+=",${version%%.*}"
          [ "$(newest .)" = "$TAG" ] && tags+=",latest"

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "image-tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "Building $TAG, tags: $tags"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    concurrency:
      group: build-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_VERSION is passed to the Dockerfile as a build arg (see
      # devcontainer.json) for the org.opencontainers.image.version label.
      # The weekly rebuild skips the layer cache: with it, every RUN layer of
      # the previous build is reused and nothing inside the image refreshes.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          IMAGE_VERSION: ${{ needs.version.outputs.version }}
        with:
          subFolder: images/dev
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ needs.version.outputs.image-tags }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          noCache: ${{ github.event_name == 'schedule' }}
          platform: linux/amd64,linux/arm64
          push: always
