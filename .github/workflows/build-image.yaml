name: Build image

# Builds the prebuilt image (amd64 + arm64) from a released version and pushes
# it to GHCR as ghcr.io/<owner>/devcontainer-dev with the tags
#   <X.Y.Z>, <X.Y>, <X>, latest and <X.Y.Z>-<yyyy-mm-dd>.
#
# - On release: release.yaml calls this with the new image-v<X.Y.Z> tag. The
#   build caches from the previous release of the same major.
# - Weekly: rebuilds the newest release of the current major and of the
#   previous one, without the layer cache. The Dockerfile installs the base
#   image's package updates, mise, gh, zizmor and Node patch releases at
#   whatever version is current, and Dependabot can't bump those, so this is
#   how they refresh. The version tags move to the fresh build, so projects on
#   `1` or `1.2` get those updates without a new release, and projects still
#   on the previous major keep getting them for a while after a breaking
#   release. Unreleased changes on main are never published.
# - On demand: rebuilds the given release, or the same two releases as the
#   weekly run, without the layer cache unless `no-cache` is unticked. The
#   floating tags <X.Y>, <X> and latest only move to a build that is the
#   newest release of that series, so rebuilding 1.2.0 after 1.3.0 can't roll
#   `1` or `latest` back.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the newest release of the current and previous major.
        type: string
        default: ""
      no-cache:
        description: Skip the layer cache, so the base image's packages, mise, gh, zizmor and Node refresh. Untick to only redo a failed build.
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the newest release of the current and previous major.
        type: string
        default: ""
      no-cache:
        description: Skip the layer cache.
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-dev

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      # [{ "tag": "image-v1.2.0", "version": "1.2.0", "major": "1", "tags": "1.2.0,1.2.0-2026-11-07,1.2,1,latest" }, ...]
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      # Only the shared script is needed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # Every image-v<X.Y.Z> tag, oldest first.
          releases="$(.github/scripts/image-releases.sh)"

          # The newest release whose version starts with $1: "1.2.", "1." or ""
          # for any. A fixed-string match, so the dots are literal; every entry
          # starts with image-v, which anchors the prefix.
          newest() { grep -F "image-v$1" <<<"$releases" | tail -1; }

          if [ -n "$TAG" ]; then
            if ! grep -qxF "$TAG" <<<"$releases"; then
              echo "::error::'${TAG}' is not an image release (image-v<X.Y.Z> tag)"
              exit 1
            fi
            build="$TAG"
          else
            # The newest release of each of the two highest majors.
            majors="$(for tag in $releases; do version="${tag#image-v}"; echo "${version%%.*}"; done | uniq | tail -2)"
            build=""
            for major in $majors; do
              build+="$(newest "${major}.")"$'\n'
            done
          fi

          if [ -z "$build" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::No image release yet, nothing to rebuild"
              exit 0
            fi
            echo "::error::No image release to build"
            exit 1
          fi

          # Each build gets its own version and a dated tag; a floating tag only
          # when that release is the newest one it could point at.
          date="$(date -u +%Y-%m-%d)"
          matrix="[]"
          for tag in $build; do
            version="${tag#image-v}"
            major="${version%%.*}"
            tags="${version},${version}-${date}"
            [ "$(newest "${version%.*}.")" = "$tag" ] && tags+=",${version%.*}"
            [ "$(newest "${major}.")" = "$tag" ] && tags+=",${major}"
            [ "$(newest "")" = "$tag" ] && tags+=",latest"
            matrix="$(jq -c --arg tag "$tag" --arg version "$version" --arg major "$major" --arg tags "$tags" \
              '. + [{tag: $tag, version: $version, major: $major, tags: $tags}]' <<<"$matrix")"
            echo "Building $tag, tags: $tags"
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each platform builds on a native runner. Emulating arm64 with QEMU on an
  # amd64 runner made that half about 10x slower than the amd64 half.
  # A platform build pushes its image by digest only, with no tag; the merge
  # job below tags the two digests together as one multi-platform image.
  build:
    name: build ${{ matrix.release.tag }} ${{ matrix.platform.arch }}
    needs: version
    if: needs.version.outputs.matrix != '[]'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.version.outputs.matrix) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      # This run's commit provides the tools (mise.toml, mise.lock); the
      # release's tag provides the image source, in release/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release.tag }}
          path: release
          persist-credentials: false

      # Provides the devcontainer CLI from mise.toml.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      # A docker-container builder: the default docker driver can't push by
      # digest.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_VERSION is passed to the Dockerfile as a build arg (see
      # devcontainer.json) for the org.opencontainers.image.version label.
      # Rebuilds skip the layer cache: with it, every RUN layer of the previous
      # build is reused and nothing inside the image refreshes. A release build
      # caches from the release's own tag (a redo), else the newest build of
      # its major, taking this platform's layers from the multi-platform image;
      # buildx skips a cache source that doesn't exist. A new major has
      # neither, so a breaking release starts from a clean build.
      - name: Build and push by digest
        env:
          IMAGE_VERSION: ${{ matrix.release.version }}
          MAJOR: ${{ matrix.release.major }}
          ARCH: ${{ matrix.platform.arch }}
          NO_CACHE: ${{ github.event_name == 'schedule' || inputs.no-cache == true }}
        run: |
          cache=(--cache-from "${IMAGE_NAME}:${IMAGE_VERSION}" --cache-from "${IMAGE_NAME}:${MAJOR}")
          [ "$NO_CACHE" = true ] && cache=(--no-cache)
          devcontainer build \
            --workspace-folder release/images/dev \
            --platform "linux/${ARCH}" \
            --image-name "$IMAGE_NAME" \
            "${cache[@]}" \
            --output "type=image,push-by-digest=true,name-canonical=true,push=true"

          # The devcontainer CLI doesn't report what it pushed. The builder's
          # record of the build it just ran does: the digest of the image index
          # (the image plus its provenance attestation).
          digest="$(docker buildx history inspect --format json \
            | jq -r '[.Attachments[] | select(.Type == "application/vnd.oci.image.index.v1+json") | .Digest] | if length == 1 then .[0] else error("expected one image index, got \(length)") end')"
          echo "Pushed ${IMAGE_NAME}@${digest} (linux/${ARCH})"
          mkdir -p digests
          echo "$digest" > "digests/${ARCH}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.release.version }}-${{ matrix.platform.arch }}
          path: digests/${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1

  # Tags each release's two platform images together as one multi-platform
  # image. Runs even if another release's build failed (fail-fast is off), and
  # fails for a release missing either platform, so nothing is published half
  # built.
  merge:
    name: merge ${{ matrix.tag }}
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.matrix) }}
    permissions:
      contents: read
      packages: write # push to GHCR
    # One merge at a time across every run of this workflow: it is the only
    # step that moves tags. A weekly rebuild of 1.2.0 and a release build of
    # 1.3.0 running side by side could both push `1` and `latest`, and
    # whichever finished last would win. The default queue keeps only one
    # waiting job and cancels the rest, which would drop a release queued
    # behind the two weekly ones.
    concurrency:
      group: build-image
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.version }}-*
          path: digests
          merge-multiple: true

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            if [ ! -s "digests/${arch}" ]; then
              echo "::error::No linux/${arch} build to publish"
              exit 1
            fi
            sources+=("${IMAGE_NAME}@$(cat "digests/${arch}")")
          done
          tags=()
          for tag in ${TAGS//,/ }; do
            tags+=(-t "${IMAGE_NAME}:${tag}")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAGS%%,*}"
