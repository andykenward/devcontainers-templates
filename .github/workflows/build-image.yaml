name: Build image

# Builds the prebuilt image (amd64 + arm64) from a released version and pushes
# it to GHCR as ghcr.io/<owner>/devcontainer-dev with the tags
#   <X.Y.Z>, <X.Y>, <X>, latest and <yyyy-mm-dd>.
#
# - On release: release.yaml calls this with the new image-v<X.Y.Z> tag.
# - Weekly: rebuilds the latest image release, picking up new releases of the
#   base image's packages, mise, Node LTS, gh and zizmor. The version tags move
#   to the fresh build, so projects on `1` or `1.2` get security updates
#   without a new release. Unreleased changes on main are never published.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the latest release.
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Image release to build (e.g. image-v1.2.0). Empty builds the latest release.
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devcontainer-dev

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/image-v" --jq '.[].ref | sub("^refs/tags/"; "")' \
              | grep -E '^image-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          fi
          if ! [[ "$TAG" =~ ^image-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::No image release to build (tag: '${TAG}')"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    concurrency:
      group: build-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "list=${VERSION},${VERSION%.*},${VERSION%%.*},latest,$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # IMAGE_VERSION is passed to the Dockerfile as a build arg (see
      # devcontainer.json) for the org.opencontainers.image.version label.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          IMAGE_VERSION: ${{ needs.version.outputs.version }}
        with:
          subFolder: images/dev
          imageName: ${{ env.IMAGE_NAME }}
          imageTag: ${{ steps.tags.outputs.list }}
          cacheFrom: ${{ env.IMAGE_NAME }}
          platform: linux/amd64,linux/arm64
          push: always
