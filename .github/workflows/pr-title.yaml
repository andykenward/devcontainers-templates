name: PR title

# PRs are squash-merged with the PR title as the commit message, so the title
# is what release-please reads to version and describe changes. It must follow
# Conventional Commits: <type>(<optional scope>)<optional !>: <description>
#
# Types that make a release (when the PR touches images/dev or src/dev):
#   feat (minor), fix, perf, deps, revert (patch); add ! for a breaking change.
# Types that don't: docs, chore, refactor, test, build, ci, style.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A newer push or title edit cancels the PR's run still in progress: only the
# newest result counts.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            chore
            refactor
            test
            build
            ci
            style
