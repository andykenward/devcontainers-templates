name: Release templates

# Publishes every template under src/ to ghcr.io/<owner>/<repo>/<id> as an OCI
# artifact, at the version in its devcontainer-template.json. Versions already
# published are skipped.
#
# release.yaml calls this when release-please releases the template, so the
# version, changelog and git tag come from the release. Run it manually to
# republish.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The template's default imageVariant must be the major version of the
      # newest image release, so new projects start on the current image and a
      # breaking image change (feat(image)!:) doesn't leave them on the old
      # major. Nothing ties the two versions together, so the same PR has to
      # bump the default by hand; this catches it before publishing a template
      # that points at a stale major.
      - name: Check that the template defaults to the newest image major
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/image-v" --jq '.[].ref | sub("^refs/tags/image-v"; "")')"
          major="$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$refs" | sort -V | tail -1 | cut -d. -f1 || true)"
          default="$(jq -r '.options.imageVariant.default' src/dev/devcontainer-template.json)"
          if [ -z "$major" ]; then
            echo "::error::No image release for the template to default to; release the image first"
            exit 1
          fi
          if [ "$default" != "$major" ]; then
            echo "::error file=src/dev/devcontainer-template.json::imageVariant defaults to '${default}' but the newest image release is ${major}.x. Set the default and proposals to '${major}' and release the template again."
            exit 1
          fi
          echo "Template defaults to image ${major}, the newest image release"

      # release-please tags releases (template-v<X.Y.Z>), so the action's own
      # template_<id>_<version> tags are turned off.
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-templates: "true"
          base-path-to-templates: ./src
          disable-repo-tagging: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
