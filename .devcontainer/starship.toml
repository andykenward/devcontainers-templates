"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt for this repo's own dev container (STARSHIP_CONFIG in
# devcontainer.json). It replaces the image's default
# (images/dev/.devcontainer/starship.toml); it doesn't add to it. Edit freely:
# open a new terminal to see changes.
# Options: https://starship.rs/config/

# Blank line before each prompt.
add_newline = true

# Every shell here is in a container, so the container indicator is noise.
[container]
disabled = true

# Terminals in containers rarely have a Nerd Font: use symbols that every font
# has (Starship's no-nerd-font preset, for the modules likely to show here).
[nodejs]
symbol = "[⬢](bold green) "

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "
